# fractal — static site, no build step.
# The repo checkout is bind-mounted read-only; nothing is compiled on the
# server, so a rollback is just a git checkout of the previous commit.
services:
  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: site-fractal-web
    # No `ports:` on purpose — the container is reachable only from the edge
    # network, i.e. only through the Capsar nginx which terminates TLS.
    volumes:
      - ./repo:/usr/share/nginx/html:ro
      - ./site-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
