# Inside the site container. TLS, HSTS and rate limiting are handled one hop
# up by the edge nginx — this server block only serves files.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location ~* \.(css|js|woff2?|ttf|eot|ico|png|jpe?g|gif|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        # Single-page apps need the /index.html fallback; multi-page sites
        # must keep the =404 so unknown paths stay 404 instead of soft-200.
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
